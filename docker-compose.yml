# Run everything on one Vultr server:  docker compose up -d --build
# - web:    landing page, live demo, Friction Map, ElevenLabs voice tool
# - agents: the seven uAgents (Agentverse mailbox mode when AGENTVERSE_API_KEY is set)
# - caddy:  HTTPS for your domain (set DOMAIN in .env), needed for the ElevenLabs webhook
services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes: [runtime:/app/data/runtime, outbox:/app/outbox]

  agents:
    build: .
    env_file: .env
    # Each agent as its own process (the setup Agentverse mailboxes are known to work with)
    command: ["sh", "-c", "./scripts/run_all.sh && tail -F logs/*.log"]
    restart: unless-stopped
    # Local-only ports, for the Agent Inspector "Connect" fallback over an SSH tunnel
    ports: ["127.0.0.1:8100-8106:8100-8106"]
    volumes: [runtime:/app/data/runtime, outbox:/app/outbox]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "web:8080"]
    volumes: [caddy_data:/data]
    depends_on: [web]

volumes:
  runtime:
  outbox:
  caddy_data:
